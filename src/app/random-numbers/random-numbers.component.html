<h1 class="my-5">Random Numbers</h1>
<table class="table">
  <thead>
    <tr>
      <th>#</th>
      <th>Array Index</th>
      <th>Number</th>
    </tr>
  </thead>
  <tbody>
    @for (randomItem of randomList; track randomItem; let randomIndex = $index) {
      <tr>
        <td>{{randomIndex+1}}</td>
        <td>{{randomIndex}}</td>
        <td>{{randomItem}}</td>
      </tr>
    }
  </tbody>
</table>
